name: Check Links

on:
  pull_request:
    paths:
      - "src/content/**"
      - "README.md"
      - "lychee.toml"
      - ".github/workflows/links.yml"
  push:
    branches: [main]
    paths:
      - "src/content/**"
      - "README.md"
      - "lychee.toml"
      - ".github/workflows/links.yml"
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check content links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress 'src/content/**/*.md' README.md
          fail: true
          jobSummary: true
          token: ${{ github.token }}
